<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Visual Tester — yayın öncesi güvenlik testi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4">
        <animate attributeName="stop-color" values="#5eead4;#818cf8;#f472b6;#5eead4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f472b6;#5eead4;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5eead4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <clipPath id="typing">
      <rect x="300" y="168" width="0" height="40">
        <animate attributeName="width" values="0;600;600;0" keyTimes="0;.45;.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .ring { fill: none; stroke: #5eead4; transform-origin: 160px 150px; animation: pulse 3s ease-out infinite; }
    .r2 { animation-delay: 1s; } .r3 { animation-delay: 2s; }
    @keyframes pulse { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
    .shield { fill: #0f1a33; stroke: #818cf8; stroke-width: 4; }
    .check { fill: none; stroke: #5eead4; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw 3.5s ease-in-out infinite; }
    @keyframes draw { 0%,15% { stroke-dashoffset: 90; } 45%,85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 90; } }
    .scanline { animation: sweep 4s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-80px); } 100% { transform: translateY(300px); } }
    .tag { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: 0; animation: blip 6s ease-in-out infinite; }
    .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; } .t4 { animation-delay: 3s; } .t5 { animation-delay: 4s; } .t6 { animation-delay: 5s; }
    @keyframes blip { 0%,100% { opacity: 0; transform: translateY(6px); } 15%,45% { opacity: 1; transform: translateY(0); } 60% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <rect width="960" height="300" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect class="scanline" x="0" y="0" width="960" height="70" fill="url(#scan)"/>

  <circle class="ring" cx="160" cy="150" r="70" stroke-width="2"/>
  <circle class="ring r2" cx="160" cy="150" r="70" stroke-width="2"/>
  <circle class="ring r3" cx="160" cy="150" r="70" stroke-width="2"/>
  <path class="shield" d="M160 78 L218 100 V150 C218 190 192 214 160 226 C128 214 102 190 102 150 V100 Z"/>
  <path class="check" d="M132 152 L153 173 L190 132"/>

  <text x="300" y="138" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#title)">Visual Tester</text>
  <g clip-path="url(#typing)">
    <text x="302" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#cbd5e1">$ yayından önce saldır → kanıtla → düzelt → doğrula</text>
  </g>
  <rect class="cursor" x="302" y="206" width="12" height="3" fill="#5eead4"/>

  <g>
    <text class="tag"    x="300" y="250" fill="#f87171">● IDOR</text>
    <text class="tag t2" x="380" y="250" fill="#fbbf24">● XSS</text>
    <text class="tag t3" x="450" y="250" fill="#f472b6">● SQLi</text>
    <text class="tag t4" x="525" y="250" fill="#60a5fa">● CSRF</text>
    <text class="tag t5" x="605" y="250" fill="#a78bfa">● JWT</text>
    <text class="tag t6" x="675" y="250" fill="#5eead4">● GO / NO-GO</text>
  </g>
  <text x="935" y="285" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">muhammedkoca.com.tr</text>
</svg>
